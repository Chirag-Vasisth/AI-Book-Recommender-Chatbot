<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Book Recommender Premium</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Modern premium fonts: Outfit for headings, Inter for body -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body class="dark-mode default">

    <!-- Ultra Premium Dynamic Background Mesh -->
    <div class="bg-orchestrator">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
    </div>

    <div class="app-container">
        <!-- Floating Glass Header -->
        <header class="app-header glass-panel">
            <div class="header-left">
                <div class="logo-container" style="background: transparent; box-shadow: none;">
                    <img src="logo.png" alt="BookAI Logo"
                        style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);">
                </div>
                <div>
                    <h1>BookAI<span class="accent-dot">.</span></h1>
                    <p class="subtitle">Your intelligent reading companion</p>
                </div>
            </div>

            <div class="header-right">
                <button id="new-chat-btn" class="nav-btn primary-btn" title="New Chat">
                    <i class="fas fa-sparkles"></i>
                    <span>New Chat</span>
                </button>

                <div class="custom-select-wrapper hidden-mobile">
                    <i class="fas fa-masks-theater select-icon"></i>
                    <select id="mood-select" class="premium-select">
                        <option value="default">Default Mood</option>
                        <option value="adventurous">Adventurous</option>
                        <option value="romantic">Romantic</option>
                        <option value="mysterious">Mysterious</option>
                        <option value="thoughtful">Thoughtful</option>
                    </select>
                </div>

                <div class="custom-select-wrapper hidden-mobile">
                    <i class="fas fa-globe select-icon"></i>
                    <select id="language-select" class="premium-select">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                    </select>
                </div>

                <button id="theme-toggle" class="nav-btn icon-btn" title="Toggle Light/Dark Mode">
                    <i class="fas fa-cloud-moon"></i>
                </button>
            </div>
        </header>

        <main class="main-content">
            <!-- Elegant Sidebar -->
            <aside class="sidebar glass-panel">
                <div class="daily-highlight">
                    <div class="highlight-header">
                        <div class="icon-circle"><i class="fas fa-star"></i></div>
                        <h3>Daily Match</h3>
                    </div>
                    <div id="daily-book" class="highlight-content">
                        <!-- Content dynamically loaded by script.js -->
                    </div>
                </div>

                <div class="sidebar-footer">
                    <div class="creator-badge">
                        <div class="pulse-indicator"></div>
                        <span>Chirag-12314277 AI Core</span>
                    </div>
                    <i class="fa-brands fa-github" style="color:var(--text-tertiary);"></i>
                </div>
            </aside>

            <!-- Expansive Chat Stage -->
            <section class="chat-section">
                <div class="chat-container glass-panel" id="chat-container">
                    <!-- Hero Welcome Area -->
                    <div class="welcome-message">
                        <div class="welcome-icon">
                            <i class="fas fa-wand-magic-sparkles"></i>
                        </div>
                        <h2>Discover Your Next<br><span>Favorite Book</span></h2>
                        <p>Tell me what you're in the mood for, or what you've enjoyed recently. I'll analyze millions
                            of titles to find your perfect match.</p>

                        <div class="quick-suggestions">
                            <button class="quick-suggestion-btn"
                                data-prompt="Recommend a gripping psychological thriller">
                                <i class="fas fa-magnifying-glass"></i> Thriller
                            </button>
                            <button class="quick-suggestion-btn" data-prompt="Suggest a hard sci-fi book set in space">
                                <i class="fas fa-rocket"></i> Sci-Fi
                            </button>
                            <button class="quick-suggestion-btn"
                                data-prompt="I need a heartwarming contemporary feel-good story">
                                <i class="fas fa-heart"></i> Romance
                            </button>
                        </div>
                    </div>

                    <!-- Chat Threads -->
                    <div class="chat-messages" id="chat-messages">
                        <!-- Populated by JS -->
                    </div>

                    <!-- AI Typing Animation -->
                    <div class="typing-indicator" id="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>

                <!-- Floating Input Island -->
                <div class="composer-island">
                    <div class="input-area">
                        <textarea id="user-input" placeholder="Ask about a genre, author, or mood..."
                            rows="1"></textarea>

                        <div class="input-actions">
                            <button id="voice-btn" class="action-btn" title="Voice Input">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <button id="send-btn" class="action-btn send-btn" title="Send Message">
                                <i class="fas fa-arrow-up"></i>
                            </button>
                        </div>
                    </div>

                    <div class="feedback-container hidden" id="feedback-container">
                        <span class="feedback-label">Was this helpful?</span>
                        <div class="feedback-buttons">
                            <button class="feedback-btn like" title="Yes, highly accurate"><i
                                    class="fas fa-check"></i></button>
                            <button class="feedback-btn dislike" title="No, try again"><i
                                    class="fas fa-times"></i></button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/voice-recognition.js"></script>
    <script src="js/script.js"></script>
    <script>
        // Micro-interactions and auto-resizing
        document.addEventListener('DOMContentLoaded', function () {
            const tex = document.getElementById('user-input');
            if (tex) {
                tex.addEventListener('input', function () {
                    this.style.height = 'auto'; // Reset
                    const newHeight = Math.min(this.scrollHeight, 200); // Max 200px
                    this.style.height = newHeight + 'px';
                });
            }
        });
    </script>
</body>

</html>
